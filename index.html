<style>
  :root {
    --bg: #f5f0e8; --panel: #fff; --accent: #8b1a1a; --accent2: #c8952a;
    --text: #1a1a1a; --muted: #888; --border: #d9d0bf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .no-print { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }

  header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 2px solid var(--accent); }
  .logo-mark { width: 48px; height: 48px; background: var(--accent); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 900; flex-shrink: 0; }
  header h1 { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 900; color: var(--accent); }
  header p { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .hall-tabs { display: flex; margin-bottom: 24px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; width: fit-content; }
  .hall-tab { padding: 9px 28px; font-size: 14px; font-weight: 700; background: #e8e0d0; color: var(--muted); cursor: pointer; border: none; border-right: 1px solid var(--border); font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; }
  .hall-tab:last-child { border-right: none; }
  .hall-tab.active { background: var(--accent); color: #fff; }

  .form-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 24px 28px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .form-card h2 { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); letter-spacing: 0.05em; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
  input[type="text"] { font-family: 'Noto Sans KR', sans-serif; font-size: 14px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; background: #faf8f5; color: var(--text); outline: none; }
  input[type="text"]:focus { border-color: var(--accent); }
  textarea { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 4px; background: #faf8f5; color: var(--text); outline: none; resize: vertical; line-height: 1.7; width: 100%; }
  textarea:focus { border-color: var(--accent); }
  code { font-family: monospace; }

  .block-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .block-tab { padding: 5px 14px; font-size: 12px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: #faf8f5; color: var(--muted); transition: all 0.12s; }
  .block-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .block-tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  .legend { display: flex; gap: 16px; margin-bottom: 14px; font-size: 12px; color: var(--muted); align-items: center; padding: 10px 12px; background: #faf8f5; border-radius: 5px; border: 1px solid var(--border); }
  .legend-dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .legend-item { display: flex; align-items: center; gap: 6px; }

  .seat-rows { display: flex; flex-direction: column; gap: 6px; }
  .seat-row { display: flex; align-items: center; gap: 6px; }

  .row-label { font-size: 11px; font-weight: 700; color: var(--accent); width: 44px; text-align: right; flex-shrink: 0; cursor: pointer; padding: 4px 6px 4px 0; border-radius: 3px; transition: all 0.12s; user-select: none; }
  .row-label:hover { background: #fdf0f0; }
  .row-label.row-excluded { color: #bbb; text-decoration: line-through; }
  .row-label.row-excluded:hover { background: #f0f7f0; color: #2a6a2a; text-decoration: none; }

  .seat-btn { width: 32px; height: 32px; border: 1px solid #aac8aa; border-radius: 4px; background: #eef7ee; font-size: 11px; font-weight: 700; color: #2a6a2a; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all 0.12s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .seat-btn:hover:not(.excluded) { border-color: var(--accent2); background: #fff8ee; }
  .seat-btn.excluded { background: #f0f0f0; border-color: #ccc; color: #bbb; text-decoration: line-through; opacity: 0.65; }
  .seat-btn.excluded:hover { background: #eef7ee; border-color: #aac8aa; color: #2a6a2a; opacity: 1; text-decoration: none; }

  .summary-bar { font-size: 13px; color: var(--accent); font-weight: 700; margin-left: auto; }

  .excluded-notice { font-size: 12px; color: #7a5a00; font-weight: 700; padding: 8px 14px; background: #fff8f0; border: 1px solid #e8c888; border-radius: 4px; margin-bottom: 16px; display: none; word-break: break-all; }

  .action-bar { display: flex; align-items: center; gap: 10px; padding: 16px 0; flex-wrap: wrap; }
  .btn-primary { padding: 11px 26px; background: var(--accent); color: #fff; border: none; border-radius: 5px; font-size: 15px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary { padding: 11px 18px; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; font-size: 13px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: all 0.15s; }
  .btn-secondary:hover { background: var(--accent); color: #fff; }
  .print-hint { font-size: 12px; color: var(--muted); }
  .mode-tabs { display: flex; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; width: fit-content; }
  .mode-tab { padding: 7px 20px; font-size: 13px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; background: #e8e0d0; color: var(--muted); cursor: pointer; border: none; border-right: 1px solid var(--border); transition: all 0.15s; }
  .mode-tab:last-child { border-right: none; }
  .mode-tab.active { background: var(--accent); color: #fff; }

  #preview-area { margin-top: 32px; padding-top: 24px; border-top: 2px dashed var(--border); display: none; }
  #preview-area h2 { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 16px; }
  .preview-scroller { overflow-x: auto; padding-bottom: 8px; }
  .ticket-preview-wrap { display: inline-block; transform-origin: top left; transform: scale(0.65); margin-bottom: -57px; margin-right: 8px; }
  .ticket-preview-wrap .ticket-wrapper { box-shadow: 0 2px 12px rgba(0,0,0,0.18); border: 0.5px solid #ccc; }

  /* ===== PRINT ===== */
  @page { size: 428pt 164pt; margin: 0; }  /* QR 있을 때 JS로 동적 변경 */
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    #print-area { display: block !important; }
    .ticket-wrapper { page-break-after: always; break-after: page; }
  }
  #print-area { display: none; }

  /* ===== TICKET ===== */
  /* QR 띠 (티켓 바로 아래, 같은 페이지) */
  .qr-strip {
    width: 428pt;
    height: 56pt;
    background: #fff;
    display: flex;
    align-items: center;
    padding: 0 10pt;
    gap: 10pt;
    border-top: 1pt dashed #aaa;
    page-break-inside: avoid;
    page-break-before: avoid;
  }
  .qr-strip-qr { flex-shrink: 0; }
  .qr-strip-qr img, .qr-strip-qr canvas { width: 44pt !important; height: 44pt !important; display: block !important; }
  .qr-strip-info { font-family: "Noto Sans KR", sans-serif; line-height: 1.5; }
  .qr-strip-label { font-size: 8.5pt; font-weight: 700; color: #1a1a1a; }
  .qr-strip-seat  { font-size: 7.5pt; color: #555; }
  .qr-strip-url   { font-size: 6pt; color: #999; margin-top: 1pt; }
  .ticket-wrapper { width: 428pt; height: 164pt; position: relative; overflow: hidden; background: #fff; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; }
  .ticket-divider { position: absolute; left: 133pt; top: 0; width: 1pt; height: 164pt; background: repeating-linear-gradient(to bottom, #888 0, #888 4pt, transparent 4pt, transparent 7pt); }
  .stub { position: absolute; left: 8.519pt; top: 0; width: 124pt; height: 164pt; }
  .stub-line { position: absolute; left: 0; width: 112pt; white-space: nowrap; overflow: hidden; font-weight: 700; line-height: 1; }
  .main { position: absolute; left: 141.347pt; top: 0; width: 278.653pt; height: 164pt; }
  .main-line { position: absolute; left: 0; white-space: nowrap; overflow: hidden; font-weight: 700; line-height: 1; }
  .mixed-row { position: absolute; left: 0; width: 278.653pt; overflow: hidden; }
  .mixed-row .span-a { position: absolute; left: 0; bottom: 0; white-space: nowrap; font-weight: 700; line-height: 1; }
  .mixed-row .span-b { position: absolute; bottom: 0; white-space: nowrap; font-weight: 700; line-height: 1; }
</style>
</head>
<body>

<div class="no-print">
  <header>
    <div class="logo-mark">국악</div>
    <div>
      <h1>KBS 국악관현악단 티켓 발급 시스템</h1>
      <p>GitHub Pages 기반 · 브라우저에서 바로 PDF 출력</p>
    </div>
  </header>

  <div class="hall-tabs">
    <button class="hall-tab active" id="tab-arthall">KBS아트홀</button>
    <button class="hall-tab" id="tab-kbshall">KBS홀</button>
  </div>

  <div class="form-card">
    <h2>공연 정보 입력</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>행사명</label>
        <input type="text" id="f-event" value="2026 시청자 감사음악회">
      </div>
      <div class="form-group">
        <label>장소</label>
        <input type="text" id="f-venue" value="KBS아트홀">
      </div>

// ========== 제외 좌석 파싱 ==========
// 입력 예:
//   A블록 전체
//   A블록 3열 전체
//   A블록 3열 1-5번
//   A블록 3열 2번
function parseExclusions() {
  var input = document.getElementById('exclude-input').value;
  var data = SEATS[hall];
  var excluded = {};   // key → true
  var errors = [];

  var lines = input.split('\n');
  lines.forEach(function(rawLine) {
    var line = rawLine.trim();
    if (!line) return;

    // 블록명 매칭
    var blk = null;
    Object.keys(data).forEach(function(b) {
      if (line.indexOf(b) === 0) blk = b;
    });
    if (!blk) { errors.push('"' + line + '" — 블록을 찾을 수 없음'); return; }

    var rest = line.slice(blk.length).trim();

    // 블록 전체
    if (rest === '전체' || rest === '') {
      data[blk].forEach(function(r) {
        r.seats.forEach(function(s) { excluded[blk+'|'+r.row+'|'+s] = true; });
      });
      return;
    }

    // 열 파싱
    var rowMatch = rest.match(/^(\d+)열\s*(.*)/);
    if (!rowMatch) { errors.push('"' + line + '" — 열 형식 오류'); return; }
    var rowNum = rowMatch[1];
    var rowLabel = rowNum + '열';
    var rowSpec = rowMatch[2].trim();

    var rowData = null;
    (data[blk] || []).forEach(function(r) { if (r.row === rowLabel) rowData = r; });
    if (!rowData) { errors.push('"' + line + '" — ' + rowLabel + ' 없음'); return; }

    // 열 전체
    if (rowSpec === '전체' || rowSpec === '') {
      rowData.seats.forEach(function(s) { excluded[blk+'|'+rowLabel+'|'+s] = true; });
      return;
    }

    // 범위: 1-5번
    var rangeMatch = rowSpec.match(/^(\d+)-(\d+)번?$/);
    if (rangeMatch) {
      var from = parseInt(rangeMatch[1]), to = parseInt(rangeMatch[2]);
      rowData.seats.forEach(function(s) {
        if (s >= from && s <= to) excluded[blk+'|'+rowLabel+'|'+s] = true;
      });
      return;
    }

    // 단일: 2번
    var singleMatch = rowSpec.match(/^(\d+)번?$/);
    if (singleMatch) {
      var sn = parseInt(singleMatch[1]);
      if (rowData.seats.indexOf(sn) >= 0) {
        excluded[blk+'|'+rowLabel+'|'+sn] = true;
      } else {
        errors.push('"' + line + '" — ' + sn + '번 좌석 없음');
      }
      return;
    }

    errors.push('"' + line + '" — 형식 오류');
  });

  return { excluded: excluded, errors: errors };
}

// ========== 티켓 빌드 ==========
var CW = {14.9635:8.79, 14.0058:13.80, 9.9358:5.62, 8.4993:5.69, 8.0204:5.08, 11.0131:8.89, 11.9708:8.89};
function afs(text, base, maxW) {
  var est = String(text).length * (CW[base] || base * 0.67);
  var fs = est <= maxW ? base : Math.max(base * maxW / est, 6);
  return fs.toFixed(4);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ========== QR 띠 빌드 ==========
function buildQRStrip(blk, row, seatNum, v) {
  if (!v.qrUrl) return '';
  var sf = blk + ' ' + row + ' ' + seatNum + '번';
  var divId = 'qrs-' + blk.replace(/[^a-zA-Z0-9]/g,'') + row.replace(/[^a-zA-Z0-9]/g,'') + seatNum;
  return '<div class="qr-strip">' +
    '<div class="qr-strip-qr" id="' + divId + '"></div>' +
    '<div class="qr-strip-info">' +
      '<div class="qr-strip-label">' + esc(v.qrLabel) + '</div>' +
      '<div class="qr-strip-seat">' + esc(sf) + '</div>' +
      '<div class="qr-strip-url">' + esc(v.qrUrl) + '</div>' +
    '</div>' +
  '</div>';
}

// ========== 미리보기 / 인쇄 ==========
function generateQRCodes(v) {
  if (!v.qrUrl || typeof qrcode === 'undefined') return;
  document.querySelectorAll('[id^="qrs-"]').forEach(function(el) {
    el.innerHTML = '';
    // qrcode-generator로 QR 매트릭스 생성
    var qr = qrcode(0, 'L');  // 타입 0=자동, 오류정정 L
    qr.addData(v.qrUrl);
    qr.make();
    var size = qr.getModuleCount();
    var cellSize = 44 / size;  // 44pt 안에 맞게 셀 크기 계산
    // SVG로 직접 렌더 → 벡터, 해상도 무관
    var svgParts = [
      '<svg xmlns="http://www.w3.org/2000/svg"',
      ' width="44pt" height="44pt"',
      ' viewBox="0 0 ' + size + ' ' + size + '"',
      ' shape-rendering="crispEdges">',
      '<rect width="' + size + '" height="' + size + '" fill="white"/>'
    ];
    for (var row = 0; row < size; row++) {
      for (var col = 0; col < size; col++) {
        if (qr.isDark(row, col)) {
          svgParts.push(
            '<rect x="' + col + '" y="' + row + '" width="1" height="1" fill="black"/>'
          );
        }
      }
    }
    svgParts.push('</svg>');
    el.innerHTML = svgParts.join('');
  });
}

function previewTickets() {
  var seats = getIssueSeats();
  if (!seats.length) { alert('발급할 좌석이 없습니다.'); return; }
  var v = getFormValues();
  var container = document.getElementById('preview-container');
  container.innerHTML = '';
  seats.forEach(function(arr) {
    var wrap = document.createElement('div');
    wrap.className = 'ticket-preview-wrap';
    wrap.innerHTML = buildTicket(arr[0], arr[1], arr[2], v) + buildQRStrip(arr[0], arr[1], arr[2], v);
    container.appendChild(wrap);
  });
  setTimeout(function(){ generateQRCodes(v); }, 50);
  var pa = document.getElementById('preview-area');
  pa.style.display = 'block';
  pa.scrollIntoView({behavior:'smooth'});
}

function printTickets() {
  var seats = getIssueSeats();
  if (!seats.length) { alert('발급할 좌석이 없습니다.'); return; }
  var v = getFormValues();
  var pa = document.getElementById('print-area');
  pa.innerHTML = seats.map(function(arr) {
    return buildTicket(arr[0], arr[1], arr[2], v) + buildQRStrip(arr[0], arr[1], arr[2], v);
  }).join('');
  if (v.qrUrl) {

// ========== 특정 좌석 파싱 (제외 파싱과 동일 문법, 결과를 포함으로 해석) ==========
function parseSpecific() {
  var input = document.getElementById('specific-input').value;
  var data = SEATS[hall];
  var included = [];
  var errors = [];
  var seen = {};

  function addSeat(blk, rowLabel, seatNum) {
    var k = blk + '|' + rowLabel + '|' + seatNum;
    if (!seen[k]) { seen[k] = true; included.push([blk, rowLabel, seatNum]); }
  }

  var lines = input.split('\n');
  lines.forEach(function(rawLine) {
    var line = rawLine.trim();
    if (!line) return;

    var blk = null;
    Object.keys(data).forEach(function(b) { if (line.indexOf(b) === 0) blk = b; });
    if (!blk) { errors.push('"' + line + '" — 블록을 찾을 수 없음'); return; }

    var rest = line.slice(blk.length).trim();

    // 블록 전체
    if (rest === '전체' || rest === '') {
      data[blk].forEach(function(r) {
        r.seats.forEach(function(s) { addSeat(blk, r.row, s); });
      });
      return;
    }

    var rowMatch = rest.match(/^(\d+)열\s*(.*)/);
    if (!rowMatch) { errors.push('"' + line + '" — 열 형식 오류'); return; }
    var rowLabel = rowMatch[1] + '열';
    var rowSpec = rowMatch[2].trim();

    var rowData = null;
    (data[blk] || []).forEach(function(r) { if (r.row === rowLabel) rowData = r; });
    if (!rowData) { errors.push('"' + line + '" — ' + rowLabel + ' 없음'); return; }

    // 열 전체
    if (rowSpec === '전체' || rowSpec === '') {
      rowData.seats.forEach(function(s) { addSeat(blk, rowLabel, s); });
      return;
    }

    // 범위
    var rangeMatch = rowSpec.match(/^(\d+)-(\d+)번?$/);
    if (rangeMatch) {
      var from = parseInt(rangeMatch[1]), to = parseInt(rangeMatch[2]);
      rowData.seats.forEach(function(s) { if (s >= from && s <= to) addSeat(blk, rowLabel, s); });
      return;
    }

    // 단일
    var singleMatch = rowSpec.match(/^(\d+)번?$/);
    if (singleMatch) {
      var sn = parseInt(singleMatch[1]);
      if (rowData.seats.indexOf(sn) >= 0) addSeat(blk, rowLabel, sn);
      else errors.push('"' + line + '" — ' + sn + '번 좌석 없음');
      return;
    }

    errors.push('"' + line + '" — 형식 오류');
  });

  return { seats: included, errors: errors };
}

// ========== getIssueSeats 오버라이드 ==========
function getIssueSeats() {
  if (printMode === 'specific') {
    return parseSpecific().seats;
  }
  var result = parseExclusions();
  var excluded = result.excluded;
  var data = SEATS[hall];
  var seats = [];
  Object.keys(data).forEach(function(blk) {
    data[blk].forEach(function(r) {
      r.seats.forEach(function(s) {
        if (!excluded[blk + '|' + r.row + '|' + s]) seats.push([blk, r.row, s]);
      });
    });
  });
  return seats;
}

// updateSummary 확장
function updateSummary() {
  if (printMode === 'specific') {
    var res = parseSpecific();
    var cnt = res.seats.length;
    document.getElementById('issue-summary').textContent = '출력 ' + cnt + '석';
    var el = document.getElementById('specific-result');
    if (res.errors.length > 0) {
      el.style.color = '#c0392b';
      el.textContent = '⚠ ' + res.errors.join(' · ');
    } else if (cnt > 0) {
      el.style.color = '#2a6a2a';
      el.textContent = '✓ ' + cnt + '석 인식됨: ' + res.seats.map(function(a){ return a[0]+' '+a[1]+' '+a[2]+'번'; }).join(', ');
    } else {
      el.style.color = 'var(--muted)';
      el.textContent = '출력할 좌석을 입력하세요';
    }
    document.getElementById('excluded-notice').textContent = '';
    return;
  }

  // 제외 모드 (기존 로직)
  var data = SEATS[hall];
  var result = parseExclusions();
  var excluded = result.excluded;
  var errors = result.errors;
  var total = 0;
  Object.keys(data).forEach(function(blk) {
    data[blk].forEach(function(r) { total += r.seats.length; });
  });
  var exCount = Object.keys(excluded).length;
  document.getElementById('issue-summary').textContent =
    '발급 ' + (total - exCount) + '석 / 전체 ' + total + '석' +
    (exCount > 0 ? '  (제외 ' + exCount + '석)' : '');
  var parseEl = document.getElementById('parse-result');
  if (errors.length > 0) {
    parseEl.style.color = '#c0392b';
    parseEl.textContent = '⚠ ' + errors.join(' · ');
  } else if (exCount > 0) {
    parseEl.style.color = '#2a6a2a';
    parseEl.textContent = '✓ 제외 좌석 ' + exCount + '석 인식됨';
  } else {
    parseEl.style.color = 'var(--muted)';
    parseEl.textContent = '제외 없이 전체 발급';
  }
  var notice = document.getElementById('excluded-notice');
  notice.textContent = exCount > 0
    ? Object.keys(excluded).map(function(k) {
        var p = k.split('|'); return p[0]+' '+p[1]+' '+p[2]+'번';
      }).join(', ')
    : '';
}

  document.getElementById('btn-preview').addEventListener('click', previewTickets);

  document.getElementById('specific-input').addEventListener('input', updateSummary);
  updateSummary();
});
